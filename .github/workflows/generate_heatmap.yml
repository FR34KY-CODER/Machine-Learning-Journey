name: Generate Repo Heatmap

on:
  schedule:
    - cron: '0 0 * * *'   # daily at midnight UTC
  workflow_dispatch:

jobs:
  heatmap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Prepare system & install Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-setuptools
          pip install pandas matplotlib calmap

      - name: Generate calendar heatmap
        run: python heatmap.py

      - name: Commit & push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heatmap.png
          git commit -m "Update heatmap" || echo "No changes"
          git push
